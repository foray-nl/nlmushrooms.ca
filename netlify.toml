# Developer-only files that Netlify would otherwise serve because the repository root is the publish directory.
# The files are still uploaded with each deploy; a forced 404 only hides their URLs. Dotfiles and .github/ are
# already not served. Add new tooling paths here (and keep website content out of these directories).

# Archived files are kept in the repository but never served: any request under /archive/ gets the 404 page.
[[redirects]]
  from = "/archive/*"
  to = "/404.html"
  status = 404
  force = true

