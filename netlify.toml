# Developer-only files that Netlify would otherwise serve because the repository root is the publish directory.
# The files are still uploaded with each deploy; a forced 404 only hides their URLs. Dotfiles and .github/ are
# already not served. Add new tooling paths here (and keep website content out of these directories).

[[redirects]]
  from = "/Gemfile"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/Gemfile.lock"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/setup.sh"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/sitemap.rb"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/spec"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/spec/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/layout"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/layout/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/manifests"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/manifests/*"
  to = "/404.html"
  status = 404
  force = true
