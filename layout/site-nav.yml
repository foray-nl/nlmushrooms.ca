# Page registry: the single source for every converted page's breadcrumb, sub-nav, <title>, description, canonical URL
# and BreadcrumbList JSON-LD (generated by scripts/apply_layout.rb; spec/layout_spec.rb fails a converted page that is
# missing here or has no description).
#
# Every page lists: file, name (breadcrumb and nav label), parent (file; omit only for the home page), description
# (70-160 characters, written for the page). Optional: title (the page's own title segment when it differs from name).
# Pages with `subnav: true` show their children (pages whose parent they are, in this order) as the horizontal sub-nav.
# <title> is "<title or name> | <each parent's title or name, nearest first, home excluded> | <site name>",
# e.g. "Contact Us | About Us | Foray Newfoundland and Labrador". The home page's title is the site name alone.
#
# `subnav_hidden: true` keeps a child out of its parent's sub-nav (the breadcrumb and title still nest under the parent).
#
# `schema_type` (optional) sets the page's schema.org type: AboutPage, ContactPage, CollectionPage; default WebPage.
# Share image (Open Graph / Twitter): `image` is a 1200x630 file under images/share/ (scripts/share_images.py builds them),
# `image_alt` describes it. The site-level image is the default; a page may set its own `image` and `image_alt`.
site:
  name: Foray Newfoundland and Labrador
  url: https://nlmushrooms.ca
  locale: en_CA
  # Organization JSON-LD. No street address on purpose: only the town and province are published as data.
  organization:
    legal_name: Mushroom Foray Newfoundland and Labrador Inc.
    logo: android-chrome-512x512.png
    email: info@nlmushrooms.ca
    telephone: "+1-709-437-5097"
    locality: Torbay
    region: NL
    country: CA
  image: images/share/default.jpg
  image_alt: "Foray Newfoundland and Labrador logo: a chanterelle mushroom beside the words Foray Newfoundland and Labrador"
pages:
  - file: index.html
    name: Home
    description: Foray Newfoundland and Labrador runs the province's annual amateur mushroom and lichen foray, publishes the Omphalina newsletter and records the fungi found.
  - file: foray_2026.html
    name: Foray 2026
    parent: index.html
    image: images/share/foray-2026.jpg
    image_alt: "Foray 2026 poster: Foray NL, Bonavista Peninsula, October 2-4, with hikers on a coastal headland"
    description: "Foray 2026: the annual Newfoundland mushroom and lichen foray at Camp Starrigan near Musgravetown on the Bonavista Peninsula, October 2-4, 2026."
  - file: past_forays.html
    name: Past Forays
    parent: index.html
    subnav: true
    schema_type: CollectionPage
    description: Every Foray Newfoundland and Labrador foray since 2003 with dates, places and posters, and links to each year's page and report.
  - file: foray_reports_all.html
    name: Foray Reports
    parent: past_forays.html
    description: Download every Foray Newfoundland and Labrador annual foray report, 2003 to the present, with species lists by trail and commentary.
  - file: foray_2025.html
    name: Foray 2025
    parent: past_forays.html
    subnav_hidden: true
    image: images/share/foray-2025.jpg
    image_alt: "Foray 2025 poster for the Pinchgut Lake foray near Corner Brook"
    description: "Foray 2025: the annual Newfoundland mushroom and lichen foray at Pinchgut Lake south of Corner Brook, September 26-28, 2025."
  - file: foray_2024.html
    name: Foray 2024
    parent: past_forays.html
    subnav_hidden: true
    image: images/share/foray-2024.jpg
    image_alt: "Foray 2024 poster for the Salmonier Nature Park foray"
    description: "Foray 2024: the annual Newfoundland mushroom and lichen foray at Salmonier Nature Park on the Avalon Peninsula, October 4-6, 2024."
  - file: foray_2023.html
    name: Foray 2023
    parent: past_forays.html
    subnav_hidden: true
    description: "Foray 2023: the annual Newfoundland mushroom and lichen foray at Max Simms Lion's Camp, Bishop's Falls, September 29 to October 1, 2023."
  - file: membership.html
    name: Membership
    parent: index.html
    description: Join Foray Newfoundland and Labrador. Membership benefits, fees, how to pay and the downloadable membership form.
  - file: resources.html
    name: Resources
    parent: index.html
    description: Links to mushroom and lichen publications, photo-sharing groups on Facebook and Flickr, and mycology websites useful to Foray NL members.
  - file: science.html
    name: Science
    parent: index.html
    description: Scholarly articles on fungi, with downloadable PDFs, that grew out of Foray NL collections and the herbarium at Grenfell Campus, Memorial University.
  - file: about_us.html
    name: About Us
    parent: index.html
    subnav: true
    schema_type: AboutPage
    description: How Foray Newfoundland and Labrador began in 2003 and grew, from the first forays to the Omphalina newsletter, the website and the people behind them.
  - file: mission.html
    name: Mission
    parent: about_us.html
    description: The mission and vision of Foray Newfoundland and Labrador, a not-for-profit organization running amateur mushroom forays in the province.
  - file: board.html
    name: Board
    parent: about_us.html
    title: Board of Directors
    description: The board of directors of Foray Newfoundland and Labrador, with the president, treasurer and secretary.
  - file: bylaws.html
    name: By Laws
    parent: about_us.html
    description: The by-laws and Policy and Procedures Manual of Mushroom Foray Newfoundland and Labrador Inc., the not-for-profit behind the annual foray.
  - file: consultants.html
    name: Consultants
    parent: about_us.html
    description: The mycological consultant, accountants and legal counsel who support Foray Newfoundland and Labrador.
  - file: contacts.html
    name: Contacts
    parent: about_us.html
    schema_type: ContactPage
    title: Contact Us
    description: Contact Foray Newfoundland and Labrador by email, telephone or mail, and find the organization on Facebook, Instagram and Flickr.
