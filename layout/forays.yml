# Every foray, newest first. Drives the Past Forays directory (past_forays.html), the report list
# (foray_reports_all.html), Event JSON-LD on forays that have their own page, and the card images.
# Sources are the foray reports and Omphalina issues in this repository; `note` records anything that needs a human eye.
#
# year, name, venue (optional), area (region shown on the card), start/end (ISO dates; end may be omitted when only the
# start is confirmed), status (held, cancelled), page (the foray's own page), report (PDF path, omit when none online),
# art (how scripts/foray_card_images.py builds images/forays/<year>.jpg: a PDF page or an image file), art_alt.
